<!DOCTYPE html>
<meta charset="utf-8">
<title>Pergole iz Pirota Mapa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400&display=swap">
<style>
/* Layout: 4:5 embed card for offer pages; 9:16 original in black and anthracite; map as quiet ground, fine white routes with a gold light travelling each one; message builds at the foot, logo closes */
:root{
  --bg:#08090a;
  --anth:#17181b;
  --land:#18191c;
  --coast:#303238;
  --ink:#f4f2ee;
  --mute:#8d8a84;
  --gold:#c9a463;
  --serif:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --sans:"Jost","Futura","Century Gothic","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
.frame{position:relative;aspect-ratio:4/5;width:100%;max-width:100%;overflow:hidden;
  background:radial-gradient(120% 80% at 70% 55%,var(--anth) 0%,var(--bg) 70%)}
.frame svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 70% at 55% 52%,transparent 45%,rgba(0,0,0,.75) 100%)}

.land{fill:var(--land);stroke:var(--coast)}
.arc{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-dasharray:1;stroke-dashoffset:1}
.comet{fill:none;stroke:var(--gold);stroke-linecap:round;stroke-dasharray:.07 1.2;stroke-dashoffset:.07;opacity:0}
.dot{fill:var(--ink);transform-box:fill-box;transform-origin:center;opacity:0}
.halo{fill:none;stroke:var(--gold);transform-box:fill-box;transform-origin:center;opacity:0}
.lbl{font-family:var(--sans);font-weight:400;fill:#d8d4cc;letter-spacing:.06em;paint-order:stroke;stroke:#0d0e10;stroke-width:.25em;opacity:0}
.lead{stroke:#8d8a84;stroke-opacity:.6;opacity:0}
.pirot{fill:var(--gold);transform-box:fill-box;transform-origin:center;opacity:0}
.ring{fill:none;stroke:var(--gold);transform-box:fill-box;transform-origin:center;opacity:0}
.plbl{font-family:var(--sans);font-weight:400;fill:var(--gold);letter-spacing:.32em;opacity:0}

.brand{font:400 26px var(--sans);letter-spacing:.5em;fill:var(--ink);opacity:.9}
.rule{stroke:var(--gold);stroke-width:1}
.cty{font:300 30px var(--sans);letter-spacing:.42em;fill:var(--gold);opacity:0}
.m1{font:400 66px var(--serif);fill:var(--ink);opacity:0}
.m2{font:italic 400 60px var(--serif);fill:var(--gold);opacity:0}

.card{position:absolute;inset:0;background:rgba(6,7,8,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5%;opacity:0;pointer-events:none}
.card img{width:52%;height:auto}
.domains{display:flex;flex-direction:column;align-items:center;gap:.9em;font-weight:300;font-size:clamp(8px,1.5vh,13px);letter-spacing:.3em;color:var(--ink);width:90%}

.line{width:12%;height:1px;background:var(--gold)}

.clist{position:absolute;left:4%;right:4%;top:4.6%;display:flex;flex-wrap:wrap;justify-content:center;gap:.3em 0;pointer-events:none;
  font:300 2.6cqw/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;text-shadow:0 0 12px #000,0 0 4px #000}
.clist span{opacity:0;color:var(--gold);white-space:nowrap;display:inline-block;max-width:0;overflow:hidden;vertical-align:top;padding-block:.3em .1em}
.clist .br{flex-basis:100%;height:0}
.clist span.nb::before{content:none}
.clist span+span::before{content:"·";color:var(--gold);opacity:.6;margin:0 .55em 0 .2em;letter-spacing:0}
.go .clist span{animation:grow 1s cubic-bezier(.45,0,.25,1) calc(var(--d) - .5s) both,fade .9s ease-out var(--d) both,settle 1.2s ease-in-out var(--n) forwards}
@keyframes grow{from{max-width:0}to{max-width:14em}}
@keyframes settle{from{opacity:1;color:var(--gold)}to{opacity:.85;color:var(--ink)}}
.frame{container-type:inline-size}
/* timeline */
.go .camg{animation:cam 21.43s cubic-bezier(.45,0,.25,1) both}
.go .a-in{animation:fade 1.6s ease-out .1s both}
.go .a-draw{animation:draw 1.3s cubic-bezier(.6,0,.2,1) var(--d) both}
.go .a-comet{animation:comet 1.3s cubic-bezier(.6,0,.2,1) var(--d) both}
.go .a-pop{animation:pop .6s ease-out var(--d) both}
.go .a-halo{animation:halo 1.4s ease-out var(--d) both}
.go .a-lbl{animation:fade .8s ease-out var(--d) both,out .8s ease-in var(--o) forwards}
.go .a-cty{animation:fade .9s ease-out var(--d) both,out .7s ease-in calc(var(--d) + var(--h)) forwards}
.go .a-pin{animation:pop .9s ease-out .5s both}
.go .a-ring{animation:ring 3.2s ease-out 1s infinite}
.go .a-plbl{animation:fade 1.2s ease-out .9s both,out 1s ease-in 10.75s forwards}
.go .a-m1{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) 1.4s both}
.go .a-m2{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) 19.83s both}
.go .a-card{animation:fade 1.6s ease-in-out 19.83s both}
.go .a-card img{animation:logo 2s cubic-bezier(.2,.7,.2,1) calc(19.83s + .5s) both}
.go .a-card .line,.go .a-card .domains{animation:fade 1.4s ease-out calc(19.83s + 1.4s) both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes comet{0%{opacity:0}4%{opacity:1}85%{opacity:1}100%{stroke-dashoffset:-1;opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes halo{0%{opacity:0;transform:scale(.6)}8%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(3.2)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes out{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(4);opacity:0}}
@keyframes logo{from{opacity:0;letter-spacing:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes cam{0%{transform:translate(540px,570px) scale(2.187) translate(-748.8px,-1096.2px)}44.097%{transform:translate(540px,570px) scale(2.063) translate(-748.8px,-1096.2px)}52.497%{transform:translate(540px,570px) scale(0.949) translate(-519.0px,-1019.9px)}100%{transform:translate(540px,570px) scale(0.911) translate(-519.0px,-1019.9px)}}
.camg{transform-origin:0 0;transform:translate(540px,570px) scale(0.911) translate(-519.0px,-1019.9px);will-change:transform}

.controls{display:flex;gap:10px}
.again{position:absolute;right:12px;bottom:10px;opacity:0;transition:opacity .6s}
.done .again{opacity:.8}
button{font:400 11px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid #3a3833;padding:12px 20px;cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.note{font-size:12px;letter-spacing:.06em;color:var(--mute);margin:0;text-align:center}
@media (prefers-reduced-motion:reduce){.go *{animation-duration:.01s!important;animation-delay:0s!important}.go .a-ring{animation:none}}
</style>
