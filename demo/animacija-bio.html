<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bioklimatska Pergola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2f3134; --muted:#857e74; --beige:#b49b80; --bg:#efeeeb; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;font-family:Inter,"Helvetica Neue",Arial,sans-serif}
  /* 4:5 okvir koji se uvek uklapa u ekran (telefon, desktop, iframe) */
  #frame{position:relative;width:min(100vw, 80vh);aspect-ratio:4/5;overflow:hidden}
  @supports not (aspect-ratio:4/5){ #frame{height:min(125vw,100vh)} }
  #stage{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0;
    background:radial-gradient(120% 90% at 50% 45%,#f6f5f3 0%,#efeeeb 60%,#e4e2de 100%);overflow:hidden}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .cap{position:absolute;left:0;right:0;text-align:center;color:var(--ink);opacity:0}
  #capTop{top:92px}
  .eyebrow{font-size:27px;letter-spacing:.3em;font-weight:500;color:var(--muted);text-transform:uppercase;min-height:34px}
  .title{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;letter-spacing:.08em;margin-top:14px;color:var(--ink);white-space:nowrap}
  .rule{width:64px;height:2px;background:var(--beige);margin:24px auto 0}
  #brand{position:absolute;left:0;right:0;bottom:150px;text-align:center;opacity:0}
  #brand .b1{font-size:38px;letter-spacing:.42em;font-weight:500;color:var(--ink);padding-left:.42em}
  #brand .b2{font-size:28px;letter-spacing:.22em;color:var(--muted);margin-top:16px}
  #replay{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;border:2px solid rgba(47,49,52,.25);background:rgba(255,255,255,.7);
    color:var(--ink);font:500 30px Inter,Arial,sans-serif;letter-spacing:.14em;padding:26px 40px;border-radius:70px;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .6s, background .3s}
  #replay.show{opacity:1;pointer-events:auto}
  #replay:hover{background:rgba(255,255,255,.95)}
  body.capture #replay{display:none}
</style>
</head>
<body>
<div id="frame">
<div id="stage">
  <svg id="svg" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" aria-label="Animacija montaže i rada bioklimatske pergole">
    <defs>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5b5e60"/><stop offset=".55" stop-color="#7d8082"/><stop offset="1" stop-color="#4c4f52"/>
      </linearGradient>
      <radialGradient id="ledPool" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ffd9a0" stop-opacity=".55"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="ledDot" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fff6e2"/><stop offset=".35" stop-color="#ffd38c" stop-opacity=".9"/><stop offset="1" stop-color="#ffb860" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop id="skyTop" offset="0" stop-color="#1d2638"/><stop id="skyBot" offset="1" stop-color="#3a4458"/>
      </linearGradient>
      <radialGradient id="ledPoolN" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ffcf92" stop-opacity=".5"/><stop offset=".55" stop-color="#ffc283" stop-opacity=".18"/><stop offset="1" stop-color="#ffbe7a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="puddle" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#8fd0ff" stop-opacity=".55"/><stop offset=".7" stop-color="#8fd0ff" stop-opacity=".25"/><stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/>
      </radialGradient>
      <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="soft3" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.5"/></filter>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    </defs>
    <g id="world"></g>
  </svg>
  <div id="capTop" class="cap">
    <div class="eyebrow" id="capEyebrow"></div>
    <div class="title" id="capTitle"></div>
    <div class="rule"></div>
  </div>
  <div id="brand"><div class="b1">PERGOLA.RS</div><div class="b2" id="brandUrl"></div></div>
  <button id="replay" type="button" aria-label="Ponovi animaciju">↻ PONOVI</button>
</div>
</div>

<script>
/* ===== Podešavanja ===== */
const BRAND_FINAL = "PERGOLA.RS";
const DURATION    = 28.0;   // montaža · rotacija · sunce · hlad · kiša · veče · završni kadar
const ASSEMBLY_END = 16.1;  // posle ovoga kreće dnevno/noćno osvetljenje

/* ===== Geometrija (metri) — x duž zida, y gore, z od zida ka napolje ===== */
const W=5.0, D=3.6, H=2.55, BH=0.22, P=0.15, TOP=H+BH;
const WALLZ=0.16;                          // dubina zidnog profila
const ZF=D-P;                              // unutrašnja ivica prednje grede
const NL=16;                               // broj lamela (paralelne sa zidom)
const PITCH=(ZF-WALLZ)/NL, LW=PITCH*1.12, LT=0.034;  // korak, širina (preklop kad su zatvorene), debljina
const LY=TOP-0.085;                        // osa rotacije lamela
const MAXA=105*Math.PI/180;                // maksimalni ugao rotacije
const C={alu:[56,59,62], lam:[66,69,73], wall:[244,243,240], floor:[228,224,218], sofa:[236,233,228], chair:[214,184,160],
         chairLeg:[196,196,194], wood:[150,108,74], pot:[120,112,104], leaf:[70,98,64]};

/* ===== Vektori i easing ===== */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(...a)||1;return [a[0]/l,a[1]/l,a[2]/l]};
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const ease=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const easeOut=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const DEG=Math.PI/180;

/* ===== Vremenski raspored ===== */
const T={ // montaža (0–16.1)
  wall:[2.2,3.3], posts:[3.3,4.3], beam:[4.0,5.0], side0:5.0, sideStep:0.45,
  lam0:6.6, lamStep:0.17, led:[9.8,11.0], furn:[10.0,11.6]
};
// ugao lamela kroz vreme: [početak, kraj, ciljni ugao u stepenima]
const ANG=[
  [13.0,14.4,105],[14.8,15.6,0],      // demonstracija pune rotacije
  [16.4,17.5,82],[18.0,18.9,48],      // sunce — svetlo kroz lamele
  [19.1,20.3,14],                     // hlad uz ventilaciju
  [21.3,22.1,0],                      // kiša — zatvaraju se
  [24.9,26.2,62]                      // veče — otvaraju se ka nebu
];
const N={ // uslovi (16.1–28)
  out:[16.1,16.9], sunIn:[16.2,17.2],
  sunOut:[20.8,21.6], rain:[21.0,21.8],
  water:[22.0,22.7], camPost:[22.0,23.0],
  rainOut:[23.9,24.7], waterOut:[23.9,24.9], camBack:[23.7,24.6],
  night:[24.0,25.6], ledOn:[24.9,25.9],
  hero:[26.4,28.0], brand:[27.0,27.7]
};
function angleAt(t){let a=0;for(const [s,e,d] of ANG){if(t<s) break; a=lerp(a,d,ease(seg(t,s,e)));}return a*DEG;}

/* ===== Kamera (ista kao kod pergole sa ceradom) ===== */
let cam;
// pogled duž lamela, odozgo sa strane — jedini ugao iz koga se otvaranje jasno vidi
const CRANE_EYE=[W+3.05,3.95,D*0.40], CRANE_TGT=[W*0.40,1.55,D*0.44];
function setCamera(t){
  const k=ease(Math.min(t,ASSEMBLY_END)/19.5);
  let eye=[lerp(W+1.55,W+1.35,k), lerp(1.12,1.10,k), lerp(D+3.7,D+3.35,k)];
  let target=[W*0.36,1.55,D*0.30];
  // rotacija lamela: kamera se podiže iznad krova da se vidi otvaranje, pa se vraća
  const crane=ease(seg(t,12.1,13.1))*(1-ease(seg(t,15.3,16.3)));
  if(crane>0){ eye=lerp3(eye,CRANE_EYE,crane); target=lerp3(target,CRANE_TGT,crane); }
  const cp=ease(seg(t,...N.camPost))*(1-ease(seg(t,...N.camBack)));
  if(cp>0){ target=lerp3(target,[W-0.7,1.35,D-0.3],cp*0.75); eye=lerp3(eye,[W+1.0,1.0,D+2.3],cp); }
  const push=ease(seg(t,...N.hero))*0.035;
  if(push>0) eye=lerp3(eye,target,push);
  const f=norm(sub(target,eye)), r=norm(cross(f,[0,1,0])), u=cross(r,f);
  cam={eye,f,r,u,focal:760,cx:540,cy:765};
}
function proj(p){const d=sub(p,cam.eye),z=dot(d,cam.f);return [cam.cx+cam.focal*dot(d,cam.r)/z, cam.cy-cam.focal*dot(d,cam.u)/z, z];}
const LIGHT=norm([0.35,0.85,0.55]);
function shade(col,n,amb=0.62){const l=amb+(1-amb)*Math.max(0,dot(n,LIGHT));return `rgb(${Math.round(col[0]*l)},${Math.round(col[1]*l)},${Math.round(col[2]*l)})`;}

/* ===== Osvetljenje (posle montaže) =====
   SVG aproksimacija: sunce kao usmereno svetlo, senke lamela i konstrukcije projektovane
   iz stvarne geometrije na pod i fasadu, LED traka kao niz tačkastih izvora. Nije ray tracing. */
const ENV={on:false, lv:[]};
function setEnv(t,pg){
  ENV.lv=pg.lv;
  const dayMix=ease(seg(t,ASSEMBLY_END,N.sunIn[1]));
  ENV.on=t>ASSEMBLY_END&&dayMix>0;
  if(!ENV.on) return;
  const rain=ease(seg(t,...N.rain))*(1-ease(seg(t,...N.rainOut)));
  const cloud=ease(seg(t,...N.sunOut)), night=ease(seg(t,...N.night));
  const el=lerp(64,57,ease(seg(t,16.1,21.6)))*DEG, az=lerp(26,33,ease(seg(t,16.1,21.6)))*DEG;
  ENV.sun=norm([Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az)]);
  ENV.sunI=ease(seg(t,...N.sunIn))*(1-cloud);
  ENV.sunCol=[1.0,0.97,0.90];
  ENV.sky=lerp3(lerp3([0.97,0.97,0.98],[0.70,0.74,0.82],cloud),[0.30,0.35,0.50],night);
  ENV.dayMix=dayMix; ENV.night=night; ENV.cloud=cloud*(1-night); ENV.rain=rain;
  ENV.water=ease(seg(t,...N.water))*(1-ease(seg(t,...N.waterOut)));
  ENV.ledN=ease(seg(t,...N.ledOn));
  ENV.leds=ENV.ledN>0?LED_PTS:[];
}
// LED traka po unutrašnjoj donjoj ivici rama (zidni profil, bočne grede, prednja greda)
const LED_RUNS=[
  [[P+0.05,H-0.005,WALLZ+0.01],[W-P-0.05,H-0.005,WALLZ+0.01]],
  [[P+0.01,H-0.005,WALLZ+0.05],[P+0.01,H-0.005,ZF-0.05]],
  [[W-P-0.01,H-0.005,WALLZ+0.05],[W-P-0.01,H-0.005,ZF-0.05]],
  [[P+0.05,H-0.005,ZF-0.01],[W-P-0.05,H-0.005,ZF-0.01]]
];
const LED_PTS=[];
LED_RUNS.forEach(([a,b])=>{const n=Math.max(2,Math.round(Math.hypot(...sub(b,a))/0.6));for(let i=0;i<=n;i++)LED_PTS.push(lerp3(a,b,i/n));});
// zaklonjenost tačke lamelama (0 = sunce, 1 = hlad): presek zraka sa svakom lamelom u ravni (z,y)
function roofShade(p){
  const s=ENV.sun; let open=1;
  for(const L of ENV.lv){
    if(L.op<0.5) continue;
    const ca=Math.cos(L.a), sa=Math.sin(L.a), hw=LW/2;
    const az=L.zc-hw*ca, ay=L.yc-hw*sa, dz=2*hw*ca, dy=2*hw*sa;
    const det=-s[2]*dy+dz*s[1]; if(Math.abs(det)<1e-6) continue;
    const rz=az-p[2], ry=ay-p[1];
    const k=(-rz*dy+dz*ry)/det, u=(s[2]*ry-s[1]*rz)/det;
    if(k<=0) continue;
    const x=p[0]+s[0]*k, e=0.06;
    const cov=smooth(-e,e,u)*smooth(-e,e,1-u)*smooth(-0.1,0.1,x-P)*smooth(-0.1,0.1,(W-P)-x);
    open*=1-cov;
  }
  return 1-open;
}
function ledAt(p,n){
  let sum=0;
  for(const L of ENV.leds){
    const v=[L[0]-p[0],L[1]-p[1],L[2]-p[2]]; if(v[1]<=0.02) continue;
    const d=Math.hypot(v[0],v[1],v[2]), cosN=(n[0]*v[0]+n[1]*v[1]+n[2]*v[2])/d;
    if(cosN<=0) continue;
    sum+=cosN*(v[1]/d)/(1+d*d*1.6);
  }
  return sum*0.085;
}
const W3=[1.0,0.74,0.47];  // ~3000K
function light(col,n,amb=0.62,p=null,opt={}){
  if(!ENV.on) return shade(col,n,amb);
  const ndl=Math.max(0,dot(n,LIGHT)), base=amb+(1-amb)*ndl;
  const vis=(p&&!opt.noShadow)?1-roofShade(p):1, nds=Math.max(0,dot(n,ENV.sun));
  const ka=amb*0.95, kd=(1-amb)*1.15+0.12;
  const led=(p&&ENV.ledN>0)?(ledAt(p,n)+(opt.glow||0))*ENV.ledN:0;
  const out=[0,1,2].map(i=>{
    const day=ENV.sky[i]*ka + ENV.sunCol[i]*ENV.sunI*kd*nds*vis + W3[i]*led;
    return clamp(lerp(base,day,ENV.dayMix)*col[i],0,255);
  });
  return `rgb(${Math.round(out[0])},${Math.round(out[1])},${Math.round(out[2])})`;
}

/* ===== Tela ===== */
function prism(base,y0,y1,col,opt={}){return {base,y0,y1,col,...opt};}
function box(x0,x1,y0,y1,z0,z1,col,opt={}){return prism([[x0,z0],[x1,z0],[x1,z1],[x0,z1]],y0,y1,col,opt);}
function cyl(cx,cz,r,y0,y1,col,n=20,opt={}){const b=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;b.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r]);}return prism(b,y0,y1,col,opt);}
function facesOf(o){
  if(o.faces) return o.faces;
  const {base,y0,y1}=o, off=o.off||[0,0,0], f=[];
  const P3=(b,y)=>[b[0]+off[0],y+off[1],b[1]+off[2]];
  f.push({pts:base.map(b=>P3(b,y1)),n:[0,1,0]});
  f.push({pts:base.map(b=>P3(b,y0)).reverse(),n:[0,-1,0]});
  for(let i=0;i<base.length;i++){
    const a=base[i],b=base[(i+1)%base.length], n=norm([b[1]-a[1],0,-(b[0]-a[0])]);
    f.push({pts:[P3(a,y0),P3(b,y0),P3(b,y1),P3(a,y1)],n});
  }
  return f;
}
function center(o){if(o.cen) return o.cen;let sx=0,sz=0;o.base.forEach(b=>{sx+=b[0];sz+=b[1]});const n=o.base.length,off=o.off||[0,0,0];return [sx/n+off[0],(o.y0+o.y1)/2+off[1],sz/n+off[2]];}
function vertsOf(o){if(o.verts) return o.verts;const off=o.off||[0,0,0],v=[];o.base.forEach(b=>{v.push([b[0]+off[0],o.y0+off[1],b[1]+off[2]]);v.push([b[0]+off[0],o.y1+off[1],b[1]+off[2]]);});return v;}
const distTo=p=>Math.hypot(...sub(p,cam.eye));

// lamela: aerodinamičan presek, rotacija oko ose paralelne sa zidom
const LSEC=[[-0.5,0],[-0.36,0.42],[0,0.5],[0.36,0.42],[0.5,0],[0.36,-0.30],[0,-0.36],[-0.36,-0.30]];
function louver(zc,yc,a,x0,x1,op){
  const ca=Math.cos(a), sa=Math.sin(a);
  const sec=LSEC.map(([u,v])=>{u*=LW;v*=LT;return [zc+u*ca-v*sa, yc+u*sa+v*ca];});   // [z,y]
  const A=sec.map(([z,y])=>[x0,y,z]), B=sec.map(([z,y])=>[x1,y,z]);
  const faces=[{pts:A.slice().reverse(),n:[-1,0,0]},{pts:B,n:[1,0,0]}];
  for(let i=0;i<sec.length;i++){
    const j=(i+1)%sec.length, ez=sec[j][0]-sec[i][0], ey=sec[j][1]-sec[i][1];
    let n=norm([0,ez,-ey]); const mz=(sec[i][0]+sec[j][0])/2-zc, my=(sec[i][1]+sec[j][1])/2-yc;
    if(n[1]*my+n[2]*mz<0) n=[0,-n[1],-n[2]];
    faces.push({pts:[A[i],A[j],B[j],B[i]],n});
  }
  return {faces,verts:A.concat(B),cen:[(x0+x1)/2,yc,zc],col:C.lam,op,noShadow:true};
}

/* ===== Statična scena ===== */
const WALL_X0=-1.7, WALL_X1=W+0.25, WALL_H=3.75;
const floorSlab=box(WALL_X0,W+0.85,-0.14,0,0,D+0.95,C.floor,{amb:0.8,noShadow:true});
const wall=box(WALL_X0,WALL_X1,-0.14,WALL_H,-0.35,0,C.wall,{amb:0.86,noShadow:true});
function arc(cx,cz,r1,r0,a0,a1,n){const o=[],i=[];for(let k=0;k<=n;k++){const a=lerp(a0,a1,k/n);o.push([cx+Math.cos(a)*r1,cz+Math.sin(a)*r1]);i.push([cx+Math.cos(a)*r0,cz+Math.sin(a)*r0]);}return o.concat(i.reverse()).reverse();}
function star(cx,cz,r1,r0,n){const b=[];for(let k=0;k<n*2;k++){const a=k/(n*2)*Math.PI*2,r=k%2?r0:r1;b.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r]);}return b;}
const FURN=(()=>{
  const F=[];
  F.push(box(3.05,4.75,0.10,0.44,0.30,1.15,C.sofa)); F.push(box(3.05,4.75,0.44,0.86,0.30,0.52,C.sofa));
  F.push(box(4.55,4.75,0.44,0.66,0.52,1.15,C.sofa)); F.push(box(3.90,4.75,0.10,0.44,1.15,2.15,C.sofa));
  F.push(box(4.55,4.75,0.44,0.66,1.15,2.15,C.sofa)); F.push(box(3.15,3.55,0.44,0.78,0.55,0.66,[214,196,172]));
  F.push(box(3.15,4.75,0.0,0.10,0.34,1.10,[90,88,86]));
  const chair=(x,z)=>{F.push(cyl(x,z,0.07,0,0.30,C.chairLeg,10));F.push(cyl(x,z,0.40,0.30,0.48,C.chair,22));
    F.push(prism(arc(x,z,0.44,0.30,Math.PI*0.95,Math.PI*2.05,14),0.48,0.92,C.chair));};
  chair(1.35,1.45); chair(2.75,1.95);
  F.push(cyl(2.15,1.05,0.38,0,0.38,C.wood,24));
  const plant=(x,z,h)=>{F.push(cyl(x,z,0.16,0,0.32,C.pot,14));F.push(prism(star(x,z,0.34,0.10,7),0.32,0.32+h,C.leaf));};
  plant(1.7,0.45,0.55); plant(2.85,0.45,0.48);
  return F;
})();

/* ===== Pergola u trenutku t ===== */
const POSTS=[[0,P],[W-P,W]];
function pergola(t){
  const L={wallBeam:[],sideBack:[],louvers:[],sideFront:[],front:[]}, lv=[];
  // 1) zidni profil
  let p=easeOut(seg(t,...T.wall));
  if(p>0){const o=[0,0.25*(1-p),0.9*(1-p)];
    L.wallBeam.push(box(-0.05,W+0.05,H,TOP,0,WALLZ,C.alu,{off:o,op:p}));
    L.wallBeam.push(box(-0.05,W+0.05,TOP,TOP+0.035,-0.02,WALLZ+0.03,C.alu,{off:o,op:p}));}
  // 2) prednji stubovi + prednja greda
  POSTS.forEach(([x0,x1],i)=>{
    const d=i*0.25, q=easeOut(seg(t,T.posts[0]+d,T.posts[1]+d));
    if(q>0) L.front.push(box(x0,x1,0,TOP,D-P,D,C.alu,{off:[0,(1-q)*1.6,0],op:q,post:i}));
  });
  p=easeOut(seg(t,...T.beam));
  if(p>0){const o=[0,1.0*(1-p),0];
    L.front.push(box(-0.04,W+0.04,H,TOP,D-P-0.01,D+0.01,C.alu,{off:o,op:p}));
    L.front.push(box(-0.05,W+0.05,TOP,TOP+0.035,D-P-0.02,D+0.025,C.alu,{off:o,op:p}));}
  // 3) bočne grede sa olukom
  [[0,P],[W-P,W]].forEach(([x0,x1],i)=>{
    const s=T.side0+i*T.sideStep, q=easeOut(seg(t,s,s+0.7));
    if(q<=0) return;
    const ob=box(x0,x1,H,TOP,WALLZ,D-P,C.alu,{off:[0,0.8*(1-q),0],op:q});
    (i?L.sideFront:L.sideBack).push(ob);
  });
  // 4) lamele, od zida ka napolje; rotacija sa blagim talasom
  for(let i=0;i<NL;i++){
    const s=T.lam0+i*T.lamStep, q=easeOut(seg(t,s,s+0.55));
    if(q<=0) continue;
    const zc=WALLZ+PITCH*(i+0.5), yc=LY+0.5*(1-q), a=angleAt(t-i*0.035);
    L.louvers.push(louver(zc,yc,a,P+0.004,W-P-0.004,q));
    lv.push({zc,yc,a,op:q});
  }
  return {L,lv};
}

/* ===== Geometrija senki ===== */
function hull(pts){
  pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const p of pts){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  return lo.slice(0,-1).concat(up.slice(0,-1));
}
function clipAxis(poly,ax,v,g){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length], ia=g?a[ax]>=v:a[ax]<=v, ib=g?b[ax]>=v:b[ax]<=v;
    if(ia) out.push(a);
    if(ia!==ib){const k=(v-a[ax])/(b[ax]-a[ax]);out.push([lerp(a[0],b[0],k),lerp(a[1],b[1],k)]);}
  }
  return out;
}
function clipRect(poly,x0,x1,y0,y1){
  for(const [ax,v,g] of [[0,x0,true],[0,x1,false],[1,y0,true],[1,y1,false]]){poly=clipAxis(poly,ax,v,g);if(poly.length<3) return [];}
  return poly;
}
function castShadow(verts){
  const s=ENV.sun, floor=[], wall=[];
  for(const p of verts){
    floor.push([p[0]-s[0]*p[1]/s[1], p[2]-s[2]*p[1]/s[1]]);
    if(s[2]>0.01) wall.push([p[0]-s[0]*p[2]/s[2], p[1]-s[1]*p[2]/s[2]]);
  }
  return {floor:clipRect(hull(floor),WALL_X0,W+0.85,0,D+0.95), wall:wall.length?clipRect(hull(wall),WALL_X0,WALL_X1,0,WALL_H):[]};
}

/* ===== Kiša ===== */
const RAIN=Array.from({length:280},(_,i)=>{
  const r=k=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};
  return {x:lerp(WALL_X0+0.1,W+1.7,r(1)), z:lerp(0.05,D+2.6,r(2)), ph:r(3), sp:lerp(6.5,8.5,r(4))};
});
const SPL=Array.from({length:36},(_,i)=>{
  const r=k=>{const x=Math.sin(i*91.7+k*57.3)*24634.6345;return x-Math.floor(x);};
  let x,z,n=0; do{ x=lerp(WALL_X0+0.2,W+0.75,r(1+n)); z=lerp(0.1,D+0.85,r(2+n)); n+=2; }
  while(x>-0.15&&x<W+0.15&&z<D+0.15&&n<20);
  return {x,z,ph:r(9)};
});
const underRoof=(x,z)=>x>-0.12&&x<W+0.12&&z>-0.05&&z<D+0.12;

/* ===== Crtanje ===== */
const NS="http://www.w3.org/2000/svg", world=document.getElementById('world');
function el(tag,attrs,parent=world){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;}
const ptsStr=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function drawObj(o,g){
  for(const f of facesOf(o)){
    const c=f.pts.reduce((a,p)=>add(a,p),[0,0,0]).map(v=>v/f.pts.length);
    if(dot(f.n,sub(cam.eye,c))<=0) continue;
    const col=light(o.col,f.n,o.amb||0.62,c,{noShadow:o.noShadow});
    el('polygon',{points:ptsStr(f.pts.map(proj)),fill:col,stroke:col,'stroke-width':0.6,'stroke-linejoin':'round'},g);
  }
}
function drawSorted(list,parent){
  list.map(o=>({o,d:distTo(center(o))})).sort((a,b)=>b.d-a.d)
      .forEach(({o})=>drawObj(o,el('g',{opacity:(o.op??1).toFixed(3)},parent)));
}
function quad(pts,attrs,g=world){return el('polygon',{points:ptsStr(pts.map(proj)),...attrs},g);}
function line3(pts,attrs,g){return el('polyline',{points:ptsStr(pts.map(proj)),fill:'none','stroke-linecap':'round','stroke-linejoin':'round',...attrs},g);}
function ellipseOn(c,ax,ay,attrs,g){
  const a=proj(c), b=proj(add(c,ax)), d=proj(add(c,ay));
  return el('ellipse',{cx:a[0].toFixed(1),cy:a[1].toFixed(1),rx:Math.max(0.5,Math.hypot(b[0]-a[0],b[1]-a[1])).toFixed(1),ry:Math.max(0.5,Math.hypot(d[0]-a[0],d[1]-a[1])).toFixed(1),...attrs},g);
}
const px=(p,w)=>cam.focal*w/Math.max(0.3,proj(p)[2]);

function render(t){

  quad([[dx0,0,dz],[dx1,0,dz],[dx1,dh,dz],[dx0,dh,dz]],{fill:'#2a2c2e'},root);
  quad([[dx0+.05,.05,dz+.001],[dx1-.05,.05,dz+.001],[dx1-.05,dh-.05,dz+.001],[dx0+.05,dh-.05,dz+.001]],{fill:'url(#glass)'},root);
  for(let i=1;i<4;i++){const x=lerp(dx0,dx1,i/4);quad([[x-.025,.05,dz+.002],[x+.025,.05,dz+.002],[x+.025,dh-.05,dz+.002],[x-.025,dh-.05,dz+.002]],{fill:'#2a2c2e'},root);}
  quad([[dx0+.3,.05,dz+.003],[dx0+.9,.05,dz+.003],[dx0+1.5,dh-.05,dz+.003],[dx0+.9,dh-.05,dz+.003]],{fill:'rgba(255,255,255,.07)'},root);
  if(ENV.on){const dk=Math.max(ENV.night*0.62,ENV.cloud*0.18);

  const furnOp=lerp(0.28,1,ease(seg(t,...T.furn)));

      if(s.wall.length>2) quad(s.wall.map(q=>[q[0],q[1],0.006]),{fill},sg);
    });
  }

  // kontaktne senke + mekana senka krova tokom montaže
  const sh=el('g',{opacity:'.5'},root);
  const fShadow=(x0,x1,z0,z1,a)=>quad([[x0,0.002,z0],[x1,0.002,z0],[x1,0.002,z1],[x0,0.002,z1]],{fill:`rgba(40,36,32,${a.toFixed(3)})`},sh);
  fShadow(3.0,4.85,0.25,2.25,0.22*furnOp); fShadow(1.0,3.2,0.95,2.4,0.15*furnOp); fShadow(1.75,2.55,0.7,1.45,.18*furnOp);
  const fake=1-(ENV.on?ENV.dayMix:0);
  if(pg.lv.length&&fake>0){

    const zEnd=WALLZ+PITCH*pg.lv.length;

  }

  // LED iz montaže (pre dnevne sekvence)

  if(led>0) quad([[0.3,0.004,0.3],[W-0.3,0.004,0.3],[W-0.3,0.004,D-0.3],[0.3,0.004,D-0.3]],{fill:'url(#ledPool)',opacity:(0.7*led).toFixed(3)},root);

  // noću: topli tragovi svetla na podu i fasadi ispod LED trake
  if(ENV.on&&ENV.ledN>0){
    const ng=el('g',{opacity:ENV.ledN.toFixed(3)},root);
    LED_PTS.forEach(L=>ellipseOn([L[0],0.004,L[2]],[0.9,0,0],[0,0,0.9],{fill:'url(#ledPoolN)',opacity:'.42'},ng));
    for(let i=0;i<=8;i++){const x=lerp(P+0.25,W-P-0.25,i/8);
      ellipseOn([x,H-0.55,0.004],[0.55,0,0],[0,0.95,0],{fill:'url(#ledPoolN)',opacity:'.6'},ng);}
  }

  // nameštaj
  drawSorted(FURN,el('g',{opacity:furnOp.toFixed(3)},root));

  // ram i lamele, od daljeg ka bližem
  drawSorted(pg.L.wallBeam,root);
  drawSorted(pg.L.sideBack,root);
  drawSorted(pg.L.louvers,root);

  // LED traka u ramu
  const strip=Math.max(led,ENV.on?ENV.ledN:0)*clamp((TOP-0.1-cam.eye[1])/0.6);
  if(strip>0){
    const ok=r=>(r===0?pg.L.wallBeam.length:r===3?pg.L.front.length>2:r===1?pg.L.sideBack.length:pg.L.sideFront.length);
    const lg=el('g',{opacity:strip.toFixed(3)},root);
    LED_RUNS.forEach((run,r)=>{ if(r===2||!ok(r)) return;
      line3(run,{stroke:'#ffcf8f','stroke-width':px(lerp3(run[0],run[1],.5),0.07).toFixed(1),opacity:'.55',filter:'url(#glow)'},lg);
      line3(run,{stroke:'#fff3dc','stroke-width':Math.max(1.4,px(lerp3(run[0],run[1],.5),0.014)).toFixed(1)},lg);
    });
  }
  drawSorted(pg.L.sideFront,root);
  if(strip>0&&pg.L.sideFront.length){ // traka desne grede se vidi ispred lamela
    const lg=el('g',{opacity:strip.toFixed(3)},root), run=LED_RUNS[2];
    line3(run,{stroke:'#ffcf8f','stroke-width':px(lerp3(run[0],run[1],.5),0.07).toFixed(1),opacity:'.55',filter:'url(#glow)'},lg);
    line3(run,{stroke:'#fff3dc','stroke-width':Math.max(1.4,px(lerp3(run[0],run[1],.5),0.014)).toFixed(1)},lg);
  }
  drawSorted(pg.L.front,root);

  // otvori za vodu na dnu oba stuba
  pg.L.front.filter(o=>o.post!==undefined).forEach(o=>{
    const xc=(o.base[0][0]+o.base[1][0])/2, oy=(o.off||[0,0,0])[1];
    const g=el('g',{opacity:o.op.toFixed(3)},root);

    ellipseOn([xc,0.085+oy,D+0.002],[0.045,0,0],[0,0.045,0],{fill:'none',stroke:'#55595e','stroke-width':px([xc,0.08,D],0.008).toFixed(1)},g);
  });

  // voda: lamele → oluk u bočnim gredama → oba stuba → otvor na dnu
  if(ENV.on&&ENV.water>0){
    const wg=el('g',{opacity:ENV.water.toFixed(3)},root), blue='#6cc4ff', flow=t*90;
    const dash=(p,w,dl)=>({stroke:blue,'stroke-width':px(p,w).toFixed(1),'stroke-dasharray':dl,'stroke-dashoffset':(-flow).toFixed(1)});
    // po lamelama od sredine ka bočnim olucima
    [2,5,8,11,14].forEach(i=>{
      const L=pg.lv[i]; if(!L) return; const y=L.yc+0.012;
      [[W/2,P+0.03],[W/2,W-P-0.03]].forEach(([a,b])=>{
        const pts=[[a,y,L.zc],[lerp(a,b,.5),y,L.zc],[b,y,L.zc]];
        line3(pts,{...dash(pts[1],0.012,'10 16'),opacity:'.5'},wg);

    [P/2,W-P/2].forEach(x=>{
      const pts=[[x,TOP-0.03,WALLZ+0.05],[x,TOP-0.03,(WALLZ+ZF)/2],[x,TOP-0.03,ZF],[x,TOP-0.03,D-P/2]];
      line3(pts,{stroke:blue,'stroke-width':px(pts[1],0.05).toFixed(1),opacity:'.25'},wg);
      line3(pts,dash(pts[1],0.02,'16 12'),wg);

      const xc=(x0+x1)/2, pts=[[xc,TOP-0.03,D+0.003],[xc,1.3,D+0.003],[xc,0.13,D+0.003]];
      line3(pts,{stroke:blue,'stroke-width':px(pts[1],0.055).toFixed(1),opacity:'.28'},wg);
      line3(pts,dash(pts[1],0.022,'14 12'),wg);
      const out=[[xc,0.085,D+0.01],[xc,0.06,D+0.09],[xc,0.02,D+0.16],[xc,0.003,D+0.2]];
      line3(out,{stroke:blue,'stroke-width':px(out[1],0.03).toFixed(1),opacity:'.9'},wg);
      const pr=0.12+0.26*ease(seg(t,N.water[0]+0.3,N.water[0]+1.6));
      ellipseOn([xc,0.003,D+0.32],[pr,0,0],[0,0,pr*0.9],{fill:'url(#puddle)'},wg);
      for(let i=0;i<3;i++){const ph=((t*1.1+i/3)%1), r=0.05+0.3*ph;
        ellipseOn([xc,0.004,D+0.25],[r,0,0],[0,0,r*0.85],{fill:'none',stroke:blue,'stroke-width':px([xc,0,D+0.3],0.006).toFixed(1),opacity:(0.6*(1-ph)).toFixed(3)},wg);}
    });
  }

  // kiša — samo van pergole
  if(ENV.on&&ENV.rain>0){
    const rg=el('g',{opacity:ENV.rain.toFixed(3),stroke:'#f4f8fc','stroke-linecap':'round'},world);
    const YT=4.8, wind=[0.10,-1,0.04];
    RAIN.forEach(d=>{
      if(underRoof(d.x,d.z)) return;
      const y=YT-((d.ph*YT+t*d.sp)%YT);
      const a=[d.x+wind[0]*(YT-y)*0.1,y,d.z+wind[2]*(YT-y)*0.1], b=add(a,[wind[0]*0.42,wind[1]*0.42,wind[2]*0.42]);
      if(b[1]<0) return;
      const pa=proj(a), pb=proj(b); if(pa[2]<1.6) return;
      el('line',{x1:pa[0].toFixed(1),y1:pa[1].toFixed(1),x2:pb[0].toFixed(1),y2:pb[1].toFixed(1),'stroke-width':clamp(cam.focal*0.006/pa[2],1.0,2.8).toFixed(2),'stroke-opacity':'.8'},rg);
    });
    const sp=el('g',{opacity:(0.7*ENV.rain).toFixed(3)},root);
    SPL.forEach(s=>{const ph=(s.ph+t*1.7)%1, r=0.015+0.07*ph;
      ellipseOn([s.x,0.003,s.z],[r,0,0],[0,0,r],{fill:'none',stroke:'#e9f0f7','stroke-width':'1.2',opacity:(1-ph).toFixed(3)},sp);});
  }

  if(led>0) el('rect',{x:0,y:0,width:1080,height:1350,fill:'#ffcf8a',opacity:(0.03*led).toFixed(3)},world);
  captions(t);
}

    capTop.style.transform=`translateY(${((1-fin)*14).toFixed(1)}px)`;
  }
  const bo=easeOut(seg(t,...N.brand));
  brand.style.opacity=bo.toFixed(3);brand.style.transform=`translateY(${((1-bo)*10).toFixed(1)}px)`;
  const nt=ENV.on?ENV.night:0, cl=ENV.on?ENV.cloud:0;
  const ink=nt>0?`rgb(${Math.round(lerp(47,242,nt))},${Math.round(lerp(49,238,nt))},${Math.round(lerp(52,230,nt))})`:'';
  const m=lerp3(lerp3([133,126,116],[58,63,72],cl),[214,200,182],nt);
  const mut=(nt>0||cl>0)?`rgb(${Math.round(m[0])},${Math.round(m[1])},${Math.round(m[2])})`:'';
  capT.style.color=ink;brandB1.style.color=ink;capE.style.color=mut;brandB2.style.color=mut;
}

/* ===== Prikaz, skaliranje, reprodukcija ===== */
const frame=document.getElementById('frame'), stage=document.getElementById('stage'), replay=document.getElementById('replay');
function fit(){stage.style.transform=`scale(${frame.clientWidth/1080})`;}
(window.ResizeObserver?new ResizeObserver(fit).observe(frame):addEventListener('resize',fit)); fit();

let start=null, running=false, done=false, played=false;
function loop(now){
  if(start===null) start=now;
  const t=(now-start)/1000;
  render(Math.min(t,DURATION));
  if(t<DURATION) requestAnimationFrame(loop); else {running=false;done=true;replay.classList.add('show');}
}
function play(){done=false;replay.classList.remove('show');start=null;if(!running){running=true;requestAnimationFrame(loop);}}
replay.addEventListener('click',e=>{e.stopPropagation();play();});
stage.addEventListener('click',()=>{if(done) play();});
window.__render=render;   // za snimanje videa

const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
if(/capture/.test(location.hash)){document.body.classList.add('capture');}
else{
  render(0);
  const go=()=>{if(played) return; played=true;
    if(reduced){render(DURATION);done=true;replay.classList.add('show');} else play();};
  const ready=document.fonts?document.fonts.ready:Promise.resolve();
  ready.then(()=>{
    if('IntersectionObserver' in window){
      new IntersectionObserver((es,o)=>{if(es.some(e=>e.isIntersecting)){o.disconnect();go();}},{threshold:0.4}).observe(frame);
    } else go();
  });
}
</script>
